name: Verify week 4 SVM homework
on:
  push:
    paths:
      - '.github/workflows/svm-check.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy pandas scikit-learn
      - run: python 第四周作业_SVM.py > 第四周实验结果.txt
      - name: Commit test output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 第四周实验结果.txt
          git commit -m "Record reproducible SVM results" || exit 0
          git push
